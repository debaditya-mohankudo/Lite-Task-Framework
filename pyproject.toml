[project]
name = "task-framework"
version = "0.1.0"
description = "Portable task tracking for AI coding agents — MCP-native, host-agnostic"
requires-python = ">=3.11"
dependencies = [
    "mcp>=1.2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["taskfw"]

[tool.pytest.ini_options]
testpaths = ["tests"]
