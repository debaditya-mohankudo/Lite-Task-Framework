[project]
name = "task-framework"
version = "0.1.0"
description = "Portable task tracking for AI coding agents — MCP-native, host-agnostic"
requires-python = ">=3.11"
dependencies = [
    "mcp>=2.1.1",
]

[project.scripts]
# The MCP server, and the backfill CLI its own docstring already advertised as
# `taskfw-backfill` before any entry point existed to provide it.
taskfw-mcp = "taskfw.mcp_server:main"
taskfw-backfill = "taskfw.backfill:main"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["taskfw"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[dependency-groups]
dev = [
    "anyio>=4.14.2",
    "pytest>=9.1.1",
]
